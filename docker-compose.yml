# docker compose up --build   then open http://localhost:5180
# Ports are bound to localhost only; override them in .env (see .env.example).
name: fitgrid

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: fitgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitgrid} # local development only
      POSTGRES_DB: fitgrid
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h forces TCP, which only answers once first-time initialisation has finished.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fitgrid", "-d", "fitgrid"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql://fitgrid:${POSTGRES_PASSWORD:-fitgrid}@db:5432/fitgrid
      # Read from your shell or .env. Without a key, extraction returns a clear 503.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FITGRID_MODEL: ${FITGRID_MODEL:-claude-sonnet-5-5}
    ports:
      - "127.0.0.1:${API_PORT:-8100}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 6s
      retries: 20

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Goes through nginx to the API, so it checks the whole path.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 6s
      retries: 20

volumes:
  db-data:
